; Impostazioni di ETF Quotazioni Downloader
; Modifica questi valori per cambiare il comportamento dell'analisi.
; Dopo ogni modifica non serve reinstallare nulla: basta salvare il file.

[analisi]
; Numero di giorni di calendario di storico da scaricare per ogni ETF.
; 130 giorni di calendario corrispondono a circa 90 giorni di borsa.
giorni_storico = 130

; Numero minimo di giorni di borsa validi richiesti per valutare un ETF.
giorni_minimi = 40

; Soglia minima di R^2 (0-1) della regressione lineare sul prezzo:
; sotto questa soglia il trend non e' considerato abbastanza lineare/pulito
; e l'ETF non compare nella classifica "grafici puliti".
r2_minimo = 0.55

; Volatilita' giornaliera (deviazione standard dei rendimenti giornalieri)
; oltre la quale il punteggio di "pulizia" viene azzerato. 0.025 = 2.5%.
volatilita_massima = 0.025

; Salto giornaliero massimo (valore assoluto del rendimento in un solo giorno)
; oltre il quale il punteggio di "pulizia" viene azzerato. 0.07 = 7%.
salto_massimo = 0.07

; Quanti ETF mostrare nella classifica "rialzisti puliti" e in quella
; "ribassisti puliti" nel report giornaliero.
top_n = 10

[rete]
; Secondi di pausa tra un download e l'altro, per non sovraccaricare Yahoo Finance.
pausa_tra_richieste = 0.5

; Numero di tentativi in caso di errore di rete per un singolo ticker.
tentativi_massimi = 3

[macd]
; Parametri classici dell'indicatore MACD (medie mobili esponenziali).
veloce = 12
lento = 26
segnale = 9

[intraday]
; Intervalli provati in cascata per il grafico "1 giorno": se il primo non
; restituisce dati sufficienti (capita per alcuni ETF o fuori orario di
; mercato), si passa al successivo. Valori validi per Yahoo Finance: 1m, 2m,
; 5m, 15m, 30m, 60m, 90m.
intervalli_1g = 5m,15m,30m

; Intervalli provati in cascata per il grafico "7 giorni".
intervalli_7g = 30m,60m,15m
